name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # A tag push must not ship binaries that do not pass CI. Runs once,
  # on the same job the build matrix needs.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel runner label: `macos-13` was retired by GitHub.
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross (linux aarch64)
        if: matrix.cross
        run: cargo install cross --locked
      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked -p brish --target ${{ matrix.target }}
          else
            cargo build --release --locked -p brish --target ${{ matrix.target }}
          fi
      - name: Package
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          name="brish-${tag}-${{ matrix.target }}"
          stage="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/brish" "$stage/"
          tar -C "$stage" -czf "$name.tar.gz" brish
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            brish-*.tar.gz
            brish-*.tar.gz.sha256
