name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross (linux aarch64)
        if: matrix.cross
        run: cargo install cross --locked
      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked -p brish --target ${{ matrix.target }}
          else
            cargo build --release --locked -p brish --target ${{ matrix.target }}
          fi
      - name: Package
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          name="brish-${tag}-${{ matrix.target }}"
          stage="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/brish" "$stage/"
          tar -C "$stage" -czf "$name.tar.gz" brish
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            brish-*.tar.gz
            brish-*.tar.gz.sha256
