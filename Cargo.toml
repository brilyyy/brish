[workspace]
resolver = "2"
members = [
    "crates/brish",
    "crates/brish-core",
    "crates/brish-builtin",
    "crates/brish-platform",
    "crates/brish-plugin-api",
    "crates/brish-theme",
    "crates/brish-words",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["briSH contributors"]
license = "MIT"
description = "A memory-safe, crash-resistant POSIX shell"
repository = "https://github.com/brilyyy/brish"

# Zero-panic policy (plan §5.2): deny unwrap/expect outside tests.
# unsafe is forbidden per-crate via #![forbid(unsafe_code)] except brish-platform.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
thiserror = "2"
tempfile = "3"
glob = "0.3"
dirs = "6"
clap = { version = "4", features = ["derive"] }
reedline = "0.52"
nu-ansi-term = "0.50"
nix = { version = "0.31", features = ["fs", "process", "signal", "term", "user", "poll"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
toml_edit = "0.25"

[profile.release]
opt-level = 2
lto = "thin"
debug = false
