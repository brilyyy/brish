[package]
name = "brish"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "brish"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
brish-core = { path = "../brish-core" }
brish-builtin = { path = "../brish-builtin" }
brish-engine = { path = "../brish-engine" }
brish-platform = { path = "../brish-platform" }
brish-plugin = { path = "../brish-plugin" }
brish-plugin-api = { path = "../brish-plugin-api" }
brish-theme = { path = "../brish-theme" }
clap.workspace = true
serde.workspace = true
toml.workspace = true
reedline.workspace = true
nu-ansi-term.workspace = true
dirs.workspace = true
tempfile.workspace = true
# Off by default: a released binary stays small and a build without
# `wasm` pulls no interpreter at all. `--features wasm` to enable.
brish-plugin-wasm = { path = "../brish-plugin-wasm", optional = true }

[features]
default = []
wasm = ["dep:brish-plugin-wasm"]

[dev-dependencies]
filetime = "0.2"
